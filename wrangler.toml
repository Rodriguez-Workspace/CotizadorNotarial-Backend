name = "cotizador-worker"
main = "src/index.ts"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

[[kv_namespaces]]
binding = "SHEETS_KV"
# ID se llenará más adelante, pero lo dejamos listo
id = "REEMPLAZAR_DESDE_CLOUDFLARE_DASHBOARD"

[vars]
# Esta variable debe configurarse en el Dashboard de Cloudflare
FIREBASE_PROJECT_ID = "REEMPLAZAR_DESDE_CLOUDFLARE_DASHBOARD"
